name: Frontend CI

on:
  push:
    branches: [main, feature/tvs-functional-e2e]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Resolve dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Build production bundle
        run: npm run build

      - name: Run unit tests
        run: npm test -- --watch=false --browsers=ChromeHeadless
